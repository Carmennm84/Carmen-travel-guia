<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Autoguía">
<meta name="theme-color" content="#1f78c8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Autoguía</title>
<style>
:root{--bg:#cfe8f9;--card:#fff;--tx:#0d2b45;--mu:#4a6a85;--ac:#1f78c8;--acx:#fff;--bd:#b4d7ee;--cl:.9}
@media (prefers-color-scheme:dark){:root{--bg:#0b2236;--card:#12324d;--tx:#e6f1fa;--mu:#9bb8d0;--ac:#7cc0ff;--acx:#06182a;--bd:#25506f;--cl:.12}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.6 Georgia,"Times New Roman",serif}
main{max-width:600px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 40px)}
header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:28px;margin:0}
.gear{background:none;border:0;font-size:24px;color:var(--tx);width:auto;padding:6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-top:14px}
label{display:block;font:13px system-ui,sans-serif;color:var(--mu);margin:10px 0 4px}
select,input{width:100%;font:16px system-ui,sans-serif;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:11px}
button{width:100%;font:600 17px system-ui,sans-serif;border:0;border-radius:12px;padding:15px;background:var(--ac);color:var(--acx);margin-top:12px}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button:disabled{opacity:.5}
#place{font:14px system-ui,sans-serif;color:var(--mu);margin:12px 0 0}
#out{white-space:pre-wrap}
.hide{display:none}
h2{font-size:19px;margin:0 0 6px}a{color:var(--ac);font:15px system-ui,sans-serif}#src{font:13px system-ui,sans-serif;color:var(--mu);margin-top:16px}main{position:relative;z-index:1}
body{background:linear-gradient(#a9d6f5,var(--bg) 340px) no-repeat var(--bg)}
@media (prefers-color-scheme:dark){body{background:linear-gradient(#123a5c,var(--bg) 340px) no-repeat var(--bg)}}
.clouds{position:absolute;top:0;left:0;right:0;height:220px;overflow:hidden;pointer-events:none;z-index:0}
.cl{position:absolute;height:34px;background:#fff;border-radius:34px;opacity:var(--cl)}
.cl::before,.cl::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cl::before{width:48px;height:48px;top:-22px;left:18%}
.cl::after{width:68px;height:62px;top:-32px;left:46%}
.c1{width:130px;top:70px;left:6%}.c2{width:170px;top:130px;right:-20px}.c3{width:100px;top:34px;right:22%}
.tb{display:flex;gap:8px;margin-top:12px}.tb button{margin-top:0}
.spk{margin-top:10px;padding:10px;font-size:15px}
footer{text-align:center;font:15px system-ui,sans-serif;color:var(--mu);margin-top:36px}
</style>
</head>
<body>
<div class="clouds"><i class="cl c1"></i><i class="cl c2"></i><i class="cl c3"></i></div>
<main>
<header><h1>Autoguía</h1></header>
<div class="card">
<label for="lang">Idioma</label>
<select id="lang">
<option value="es">Español</option><option value="en">English</option>
<option value="fr">Français</option><option value="it">Italiano</option>
<option value="de">Deutsch</option><option value="pt">Português</option>
<option value="ca">Català</option>
</select>
</div>
<button id="go">Qué hay a mi alrededor</button>
<button id="walk" class="sec">🚶 Modo paseo</button>
<p id="place"></p>
<div id="list"></div>
<p id="src" class="hide">Fuente: Wikipedia (licencia CC BY-SA).</p>
<footer>Carmen_travel.org</footer>
</main>
<script>
var $=function(i){return document.getElementById(i)};
var S=function(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
var T={es:["Buscando tu ubicación…","Cerca de ti","Leer más","No hay artículos de Wikipedia cerca en este idioma.","m"],
en:["Finding your location…","Near you","Read more","No Wikipedia articles nearby in this language.","m"],
fr:["Recherche de votre position…","Près de vous","Lire la suite","Aucun article Wikipédia à proximité dans cette langue.","m"],
it:["Ricerca della posizione…","Vicino a te","Leggi di più","Nessun articolo di Wikipedia vicino in questa lingua.","m"],
de:["Standort wird gesucht…","In deiner Nähe","Weiterlesen","Keine Wikipedia-Artikel in der Nähe in dieser Sprache.","m"],
pt:["A procurar a sua localização…","Perto de si","Ler mais","Não há artigos da Wikipédia por perto neste idioma.","m"],
ca:["Buscant la teva ubicació…","A prop teu","Llegeix-ne més","No hi ha articles de la Viquipèdia a prop en aquest idioma.","m"]};
var VL={es:"es-ES",en:"en-GB",fr:"fr-FR",it:"it-IT",de:"de-DE",pt:"pt-PT",ca:"ca-ES"},RES=[];
function speak(items,keep){
  if(!window.speechSynthesis) return;
  if(!keep) speechSynthesis.cancel(); var lc=$("lang").value;
  var v=(speechSynthesis.getVoices()||[]).filter(function(x){return x.lang.slice(0,2)===lc})[0];
  items.forEach(function(t){var u=new SpeechSynthesisUtterance(t);u.lang=VL[lc];if(v)u.voice=v;speechSynthesis.speak(u)});
}
function stopSpeak(){if(window.speechSynthesis)speechSynthesis.cancel()}
var nl=(navigator.language||"es").slice(0,2); $("lang").value=S("lang")||(T[nl]?nl:"es");
$("lang").onchange=function(){S("lang",$("lang").value)};
function d(a,b,c,e){var r=Math.PI/180,x=(c-a)*r,y=(e-b)*r,h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return Math.round(12742000*Math.asin(Math.sqrt(h)))}
function getPos(){return new Promise(function(ok,no){if(!navigator.geolocation)return no({code:0});navigator.geolocation.getCurrentPosition(ok,no,{enableHighAccuracy:true,timeout:20000,maximumAge:15000})})}
function wiki(lc,la,lo,rad){
  var u="https://"+lc+".wikipedia.org/w/api.php?action=query&generator=geosearch&ggscoord="+la+"|"+lo+"&ggsradius="+rad+"&ggslimit=8&prop=extracts|coordinates&exintro=1&explaintext=1&exchars=500&exlimit=max&format=json&origin=*";
  return fetch(u).then(function(r){return r.json()}).then(function(j){
    var p=j.query?Object.keys(j.query.pages).map(function(k){return j.query.pages[k]}):[];
    return p.map(function(x){var c=x.coordinates&&x.coordinates[0];x.dist=c?d(la,lo,c.lat,c.lon):99999;return x}).sort(function(a,b){return a.dist-b.dist});
  });
}
var RAD=100;
function renderList(r,lc,t){
  $("list").innerHTML="";
    if(!r.length){var c0=document.createElement("div");c0.className="card";c0.textContent=t[3]+" (≤ "+RAD+" m)";
      if(RAD<500){var b=document.createElement("button");b.className="sec";b.textContent="Buscar hasta 500 m";b.onclick=function(){RAD=500;run()};c0.appendChild(b)}
      $("list").appendChild(c0);}
    RES=r;
    if(r.length){var tb=document.createElement("div");tb.className="tb";
      var b1=document.createElement("button");b1.textContent="🔊 Escuchar todo";b1.onclick=function(){speak(RES.map(function(x){return x.title+". "+(x.extract||"")}))};
      var b2=document.createElement("button");b2.className="sec";b2.textContent="⏹ Parar";b2.onclick=stopSpeak;
      tb.appendChild(b1);tb.appendChild(b2);$("list").appendChild(tb)}
    r.forEach(function(x){
      var c=document.createElement("div");c.className="card";
      var h=document.createElement("h2");h.textContent=x.title+" · "+x.dist+" "+t[4];
      var e=document.createElement("div");e.textContent=x.extract||"";e.style.whiteSpace="pre-wrap";
      var a=document.createElement("a");a.href="https://"+lc+".wikipedia.org/?curid="+x.pageid;a.target="_blank";a.rel="noopener";a.textContent=t[2];
      var sp=document.createElement("button");sp.className="sec spk";sp.textContent="🔊 Escuchar";sp.onclick=function(){speak([x.title+". "+(x.extract||"")])};
      c.appendChild(h);c.appendChild(e);c.appendChild(sp);c.appendChild(a);$("list").appendChild(c);
    });
}
async function run(){
  var lc=$("lang").value,t=T[lc]; $("go").disabled=true; $("list").innerHTML=""; $("src").classList.add("hide");
  stopSpeak(); $("place").textContent=t[0];
  try{
    var p=await getPos(),la=p.coords.latitude,lo=p.coords.longitude;
    $("place").textContent=t[1]+" (≤ "+RAD+" m) · "+la.toFixed(4)+", "+lo.toFixed(4)+" (±"+Math.round(p.coords.accuracy)+" m)"+(p.coords.accuracy>100?" · GPS poco preciso, sal a cielo abierto":"");
    var r=await wiki(lc,la,lo,RAD);
    renderList(r,lc,t);
    $("src").classList.remove("hide");
  }catch(e){
    $("place").textContent=e&&e.code===1?"Safari no tiene permiso para tu ubicación. Ve a Ajustes del iPhone → Privacidad → Localización → Safari y actívala.":"No se pudo obtener la ubicación. Comprueba el GPS e inténtalo de nuevo.";
  }
  $("go").disabled=false;
}
$("go").onclick=function(){stopWalk();RAD=100;run()};
var WT={es:"Modo paseo activado",en:"Walking mode on",fr:"Mode balade activé",it:"Modalità passeggiata attiva",de:"Spaziermodus aktiv",pt:"Modo passeio ativado",ca:"Mode passeig activat"};
var walking=null,lastP=null,spoken={},fetching=false,wl=null;
async function keepAwake(){try{if(navigator.wakeLock)wl=await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",function(){if(walking!==null&&document.visibilityState==="visible")keepAwake()});
function stopWalk(){
  if(walking!==null&&navigator.geolocation)navigator.geolocation.clearWatch(walking);
  walking=null;stopSpeak();try{if(wl)wl.release()}catch(e){}wl=null;
  $("walk").textContent="🚶 Modo paseo";
}
function walkStep(p){
  var la=p.coords.latitude,lo=p.coords.longitude,lc=$("lang").value,t=T[lc];
  $("place").textContent="🚶 "+la.toFixed(4)+", "+lo.toFixed(4)+" (±"+Math.round(p.coords.accuracy)+" m)"+(p.coords.accuracy>100?" · GPS poco preciso":"");
  if(fetching||(lastP&&d(lastP.la,lastP.lo,la,lo)<50))return;
  fetching=true;
  wiki(lc,la,lo,RAD).then(function(r){
    lastP={la:la,lo:lo};
    renderList(r,lc,t);$("src").classList.remove("hide");
    var n=r.filter(function(x){return!spoken[lc+x.pageid]})[0];
    if(n){spoken[lc+n.pageid]=1;speak([n.title+". "+(n.extract||"")],true)}
  }).catch(function(){}).then(function(){fetching=false});
}
$("walk").onclick=function(){
  if(walking!==null){stopWalk();return}
  if(!navigator.geolocation){$("place").textContent="Este navegador no permite acceder a la ubicación.";return}
  RAD=100;lastP=null;spoken={};stopSpeak();
  speak([WT[$("lang").value]]);keepAwake();
  walking=navigator.geolocation.watchPosition(walkStep,function(e){
    $("place").textContent=e&&e.code===1?"Safari no tiene permiso para tu ubicación. Ve a Ajustes del iPhone → Privacidad → Localización → Safari y actívala.":"No se pudo obtener la ubicación. Comprueba el GPS.";
    if(e&&e.code===1)stopWalk();
  },{enableHighAccuracy:true,maximumAge:5000,timeout:30000});
  $("walk").textContent="⏹ Detener modo paseo";
};

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
